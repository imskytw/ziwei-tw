name: unpack-source
on:
  push:
    paths: ['ziwei-tw-source.tar.gz']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          set -e
          test -f ziwei-tw-source.tar.gz
          tar -xzf ziwei-tw-source.tar.gz --strip-components=1
          git rm -q ziwei-tw-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F - <<'MSG'
          紫微斗數繁體開源版：更新原始碼

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01HtKRFooqyZXiypD1uaS7M6
          MSG
          git push
